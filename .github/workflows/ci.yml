name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-core.txt ]; then pip install -r requirements-core.txt; fi
          if [ -f requirements-optional.txt ]; then pip install -r requirements-optional.txt || true; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q
      - name: Offline fixture benchmark smoke
        env:
          PYTHONPATH: .
        run: |
          if [ -f scripts/verify_remote_sensing_e2e.py ]; then
            python scripts/verify_remote_sensing_e2e.py || true
          fi
