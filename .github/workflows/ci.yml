name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      # Informational only: native wheels (llama-cpp-python, hnswlib) do not
      # build on every runner. A failure here is visible, never hidden with
      # `|| true`, and is never used as release evidence.
      - name: Install optional integrations (informational)
        continue-on-error: true
        run: |
          # Match the documented offline gate (docs/testing.md): streamlit and
          # pandas are console-only, and hnswlib is a native ANN index that
          # legitimately reorders near-ties. Installing them changes the test
          # contract, so they are exercised by their own informational steps.
          grep -v -E '^(streamlit|pandas|hnswlib)' requirements-optional.txt > /tmp/optional.txt
          pip install -r /tmp/optional.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q
      # No `|| true`: this is a verification command, not an install step.
      - name: Offline fixture benchmark smoke
        env:
          PYTHONPATH: .
          RECAMEM_ANCHOR: mock
        run: python scripts/verify_remote_sensing_e2e.py
