name: companion

# The companion surface is verifiable without weights, a GPU or a browser:
# svelte-check, Vitest, the Python contract tests and a headless HTTP smoke.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Install frontend dependencies
        run: npm --prefix companion ci
      - name: Type check
        run: npm --prefix companion run typecheck
      - name: Frontend unit tests
        run: npm --prefix companion test
      - name: Build frontend
        run: npm --prefix companion run build
      - name: Companion contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -q -k companion
      - name: Headless companion smoke
        env:
          PYTHONPATH: .
          RECAMEM_ANCHOR: mock
        run: python scripts/run_companion.py
